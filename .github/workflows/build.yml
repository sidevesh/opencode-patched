name: build

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "opencode version to build (empty = latest upstream release)"
        required: false
      force:
        description: "Rebuild even if a release for this version exists"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
      latest: ${{ steps.resolve.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          upstream="$(curl -fsSL 'https://opencode.ai/update/api/latest/cli/npm?current=0.0.0' | jq -r .version)"
          version="${INPUT_VERSION:-$upstream}"
          version="${version#v}"
          echo "upstream latest: $upstream, building: $version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "latest=$([ "$version" = "$upstream" ] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          failed="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label build-failure --json body -q '.[0].body')"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            echo "release v$version already exists"
            echo "build=false" >>"$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = schedule ] && printf '%s' "$failed" | grep -qF "<!-- failed: v$version @ $GITHUB_SHA -->"; then
            # Same version and same commit already failed; retrying would only fail again.
            echo "v$version already failed at $GITHUB_SHA, waiting for a fix or a new upstream release"
            echo "build=false" >>"$GITHUB_OUTPUT"
          else
            echo "build=true" >>"$GITHUB_OUTPUT"
          fi

      # GitHub disables scheduled workflows after 60 days without repository activity.
      - name: Keep schedule alive
        run: |
          last="$(git log -1 --format=%ct)"
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 24 * 3600 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled builds alive"
            git push
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-15
          - platform: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build
        env:
          GH_TOKEN: ${{ github.token }}
          PLATFORM: ${{ matrix.platform }}
        run: scripts/build.sh "${{ needs.check.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  # Publishes whichever platforms built, so one failing platform doesn't hold back the other.
  publish:
    needs: [check, build]
    if: ${{ !cancelled() && needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          LATEST: ${{ needs.check.outputs.latest }}
        run: |
          set -euo pipefail
          ls dist/opencode-* >/dev/null  # fails when no platform built
          cat dist/SHA256SUMS-* >dist/SHA256SUMS
          {
            echo "opencode [v$VERSION](https://github.com/anomalyco/opencode/releases/tag/v$VERSION) with opentui v$(cat dist/opentui-version), plus:"
            echo
            sort -u dist/patches.md
            echo
            echo "Install or update: \`curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | bash\`"
          } >notes.md
          assets=(dist/opencode-* dist/SHA256SUMS dist/update.json)
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "v$VERSION" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$VERSION" "${assets[@]}" --title "opencode $VERSION (patched)" --notes-file notes.md --latest="$LATEST" --repo "$GITHUB_REPOSITORY"
          fi

  # Failed builds publish nothing, so surface them as an issue (GitHub notifies the repo owner).
  report:
    needs: [check, build, publish]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ needs.check.result == 'failure' || needs.build.result == 'failure' || needs.publish.result == 'failure' }}
          BUILT: ${{ needs.build.result == 'success' && needs.publish.result == 'success' }}
          VERSION: ${{ needs.check.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create build-failure --repo "$GITHUB_REPOSITORY" --color B60205 --force >/dev/null
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label build-failure --json number -q '.[0].number')"
          body="The build failed, so no patched release was published. Most likely a patch no longer applies to the new upstream version. Scheduled runs won't retry until main changes or a new opencode version comes out. Log: $RUN_URL

          <!-- failed: v$VERSION @ $GITHUB_SHA -->"
          if [ "$FAILED" = true ] && [ -z "$open" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --label build-failure \
              --title "Build failing for opencode v$VERSION" --body "$body"
          elif [ "$FAILED" = true ]; then
            gh issue edit "$open" --repo "$GITHUB_REPOSITORY" --title "Build failing for opencode v$VERSION" --body "$body"
          elif [ "$BUILT" = true ] && [ -n "$open" ]; then
            gh issue close "$open" --repo "$GITHUB_REPOSITORY" --comment "Fixed: opencode v$VERSION built and published in $RUN_URL"
          fi
